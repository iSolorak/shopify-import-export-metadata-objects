# Host nginx site config for the Shopify app — STAGE 1 (HTTP only, no TLS).
#
# Do not install this by hand; run the installer, which handles both stages:
#
#   sudo ./deploy/setup-tls.sh
#
# It copies this file into /etc/nginx/conf.d/shopify-app.conf, proves the ACME
# challenge path is reachable from the internet, obtains the certificate with
# certbot's webroot plugin, and then swaps in shopify-app-tls.conf (stage 2).
#
# Why webroot and not `certbot --nginx`: the nginx plugin has to find and patch
# the server block that serves this hostname. On a box with other vhosts, if the
# request falls through to a default server instead, the plugin patches nothing
# and the challenge 404s. The permanent acme-challenge location below removes
# that guesswork — both issuance and renewal serve from a real directory.
#
# The placeholders __DOMAIN__ and __APP_PORT__ are substituted by the installer.

upstream shopify_app {
    server 127.0.0.1:__APP_PORT__;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Served from a real directory so certbot --webroot can drop tokens here for
    # both the first issuance and every renewal. Must stay above any redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    # Do NOT add X-Frame-Options or a frame-ancestors CSP here.
    # This app renders inside an iframe in the Shopify admin and the Shopify
    # library already sends the correct per-shop frame-ancestors header.
    # A frame-blocking header at this layer makes the embedded app render blank.
    proxy_hide_header X-Frame-Options;

    # Metaobject import payloads can be large, and an import can run well past
    # nginx's 60s default.
    client_max_body_size 25m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    access_log /var/log/nginx/shopify-app.access.log;
    error_log  /var/log/nginx/shopify-app.error.log warn;

    location / {
        proxy_pass http://shopify_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this the app builds http:// OAuth redirect URLs and Shopify
        # rejects the callback. Shopify only ever reaches this app over HTTPS,
        # so hardcoding https is correct even in the port 80 block.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # No Upgrade/Connection headers: the production server serves plain
        # HTTP only. Websockets are a dev-mode (Vite HMR) concern.

        # Stream responses straight through rather than buffering them to disk.
        proxy_buffering off;
    }
}
