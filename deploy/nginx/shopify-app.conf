# Host nginx site config for the Shopify app.
#
# This is the pre-TLS starting point: HTTP only, no certificate paths, so
# `nginx -t` passes before any certificate exists.
#
# Install:
#   sudo cp deploy/nginx/shopify-app.conf /etc/nginx/sites-available/shopify-app.conf
#   sudo ln -s /etc/nginx/sites-available/shopify-app.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# On RHEL/Alma/Rocky there is no sites-enabled; drop it in /etc/nginx/conf.d/ instead.
#
# MODIFY BEFORE USE:
#   1. Replace app.example.com with your domain.
#   2. Replace 3000 in the upstream if you set APP_PORT to something else in .env.
#
# Then issue the certificate:
#   sudo certbot --nginx -d app.example.com
#
# certbot rewrites this file in place: it copies the server block to a port 443
# block, adds ssl_certificate/ssl_certificate_key and the Let's Encrypt SSL
# options, and turns the port 80 block into an HTTP -> HTTPS redirect. Every
# proxy setting below is carried over, so nothing here needs editing afterwards.

upstream shopify_app {
    # Matches the loopback publication in docker-compose.yml.
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    # Leave this reachable over plain HTTP — certbot issuance and renewals
    # depend on it. Keep it above the redirect certbot inserts.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Do NOT add X-Frame-Options or a frame-ancestors CSP here.
    # This app renders inside an iframe in the Shopify admin and the Shopify
    # library already sends the correct per-shop frame-ancestors header.
    # A frame-blocking header at this layer makes the embedded app render blank.
    #
    # If your nginx.conf sets X-Frame-Options globally, neutralise it for this
    # site by uncommenting the next line:
    # proxy_hide_header X-Frame-Options;

    # Metaobject import payloads can be large, and an import can run well past
    # nginx's 60s default.
    client_max_body_size 25m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    access_log /var/log/nginx/shopify-app.access.log;
    error_log  /var/log/nginx/shopify-app.error.log warn;

    location / {
        proxy_pass http://shopify_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this the app builds http:// OAuth redirect URLs and Shopify
        # rejects the callback. Shopify only ever reaches this app over HTTPS,
        # so hardcoding https is correct even in the port 80 block.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # No Upgrade/Connection headers: the production server serves plain
        # HTTP only. Websockets are a dev-mode (Vite HMR) concern.

        # Stream responses straight through rather than buffering them to disk.
        proxy_buffering off;
    }
}

# After certbot has run, add HSTS to the generated port 443 block:
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Don't add it to the port 80 block — HSTS over plain HTTP is ignored.
