# Host nginx site config for the Shopify app.
#
# Do not install this by hand; run the installer:
#
#   sudo ./deploy/setup-tls.sh
#
# It substitutes __DOMAIN__ and __APP_PORT__ and copies the result into
# /etc/nginx/conf.d/shopify-app.conf.
#
# This file is installed twice. Before the certificate exists, nginx refuses to
# start with an ssl_certificate pointing at a missing file, so the installer
# first strips everything between the BEGIN/END TLS markers below, obtains the
# certificate over plain HTTP, then reinstalls the file whole. The markers are
# load-bearing: keep them on their own lines and keep the 443 server block
# entirely between them.
#
# The port 80 block is the same in both passes. It only ever serves the ACME
# challenge and redirects; the app is never reachable over plain HTTP, which is
# what we want anyway since Shopify only talks to it over HTTPS.
#
# Nothing here is generated by certbot: the certificate is obtained with the
# webroot plugin, which only writes challenge files and never touches nginx
# config. Editing this file is safe — a renewal will not clobber it.

upstream shopify_app {
    server 127.0.0.1:__APP_PORT__;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Served from a real directory so certbot --webroot can drop tokens here for
    # both the first issuance and every renewal. Must stay above the redirect: a
    # redirected challenge does still work, but only while port 443 is healthy —
    # this way renewal does not depend on the certificate it is renewing.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# BEGIN TLS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_shopify_app:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Only meaningful over HTTPS; the port 80 block deliberately omits it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Do NOT add X-Frame-Options or a frame-ancestors CSP here.
    # This app renders inside an iframe in the Shopify admin and the Shopify
    # library already sends the correct per-shop frame-ancestors header.
    # A frame-blocking header at this layer makes the embedded app render blank.
    # This strips one set globally by a shared nginx.conf, if any.
    proxy_hide_header X-Frame-Options;

    # Metaobject import payloads can be large, and an import can run well past
    # nginx's 60s default.
    client_max_body_size 25m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    access_log /var/log/nginx/shopify-app.access.log;
    error_log  /var/log/nginx/shopify-app.error.log warn;

    location / {
        proxy_pass http://shopify_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # No Upgrade/Connection headers: the production server serves plain
        # HTTP only. Websockets are a dev-mode (Vite HMR) concern.

        # Stream responses straight through rather than buffering them to disk.
        proxy_buffering off;
    }
}
# END TLS
