# Host nginx site config for the Shopify app.
#
# Install:
#   sudo cp deploy/nginx/shopify-app.conf /etc/nginx/sites-available/shopify-app.conf
#   sudo ln -s /etc/nginx/sites-available/shopify-app.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# On RHEL/Alma/Rocky there is no sites-enabled; drop it in /etc/nginx/conf.d/ instead.
#
# MODIFY BEFORE USE:
#   1. Replace app.example.com with your domain (both server blocks).
#   2. Replace 3000 in proxy_pass if you set APP_PORT to something else in .env.
#
# Apply this file with only the port 80 block first, then run certbot:
#   sudo certbot --nginx -d app.example.com
# Certbot fills in the certificate paths and the redirect for you. If you prefer
# to manage it by hand, the finished port 443 block below is what you want.

upstream shopify_app {
    # Matches the loopback publication in docker-compose.yml.
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    # Leave this reachable over plain HTTP — certbot renewals depend on it.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.com;

    # Written by `certbot --nginx`. Adjust if you issued the cert another way.
    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Do NOT add X-Frame-Options or a frame-ancestors CSP here.
    # This app renders inside an iframe in the Shopify admin and the Shopify
    # library already sends the correct per-shop frame-ancestors header.
    # A frame-blocking header at this layer makes the embedded app render blank.
    #
    # If your nginx.conf sets X-Frame-Options globally, neutralise it for this
    # site by uncommenting the next line:
    # proxy_hide_header X-Frame-Options;

    # Metaobject import payloads can be large, and an import can run well past
    # nginx's 60s default.
    client_max_body_size 25m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    access_log /var/log/nginx/shopify-app.access.log;
    error_log  /var/log/nginx/shopify-app.error.log warn;

    location / {
        proxy_pass http://shopify_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this the app builds http:// OAuth redirect URLs and Shopify
        # rejects the callback.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # No Upgrade/Connection headers: the production server serves plain
        # HTTP only. Websockets are a dev-mode (Vite HMR) concern.

        # Stream responses straight through rather than buffering them to disk.
        proxy_buffering off;
    }
}
