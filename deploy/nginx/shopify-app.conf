# Host nginx site config for the Shopify app.
#
# Install it as-is — the domain and port below are the real ones, so this file
# is valid the moment it lands on the host:
#
#   sudo cp deploy/nginx/shopify-app.conf /etc/nginx/conf.d/shopify-app.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# It carries no placeholders on purpose. An earlier version used __DOMAIN__ and
# __APP_PORT__ tokens that an installer substituted, and hand-copying it put
# `server 127.0.0.1:__APP_PORT__;` into production, which fails the config test
# and blocks reloads for every other site on the host.
#
# `deploy/setup-tls.sh` still installs this file and can retarget it at another
# domain or port via DOMAIN=/APP_PORT=; it rewrites the concrete values below.
#
# The 443 block needs the certificate to exist already — nginx refuses to load a
# config whose ssl_certificate points at a missing file. On a host without one
# yet, install this file with everything between the BEGIN/END TLS markers
# removed, obtain the certificate over plain HTTP, then install it whole:
#
#   sudo certbot certonly --webroot -w /var/www/certbot -d shopify-app.solorak.xyz \
#     --non-interactive --agree-tos -m you@example.com \
#     --deploy-hook "systemctl reload nginx"
#
# The markers are load-bearing for that two-pass install and for setup-tls.sh:
# keep them on their own lines, with the 443 server block entirely between them.
#
# Nothing here is generated by certbot: the webroot plugin only writes challenge
# files and never touches nginx config. Editing this file is safe — a renewal
# will not clobber it.

upstream shopify_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name shopify-app.solorak.xyz;

    # Served from a real directory so certbot --webroot can drop tokens here for
    # both the first issuance and every renewal. Must stay above the redirect: a
    # redirected challenge does still work, but only while port 443 is healthy —
    # this way renewal does not depend on the certificate it is renewing.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# BEGIN TLS
server {
    # http2 as a listen parameter, not the `http2 on;` directive: the latter is
    # nginx >= 1.25.1 only and the deployment host runs an older build, where it
    # fails the config test with `unknown directive "http2"`. Newer nginx still
    # accepts this form, only warning that it is deprecated.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shopify-app.solorak.xyz;

    # ssl_certificate     /etc/letsencrypt/live/shopify-app.solorak.xyz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/shopify-app.solorak.xyz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_shopify_app:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Only meaningful over HTTPS; the port 80 block deliberately omits it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Do NOT add X-Frame-Options or a frame-ancestors CSP here.
    # This app renders inside an iframe in the Shopify admin and the Shopify
    # library already sends the correct per-shop frame-ancestors header.
    # A frame-blocking header at this layer makes the embedded app render blank.
    # This strips one set globally by a shared nginx.conf, if any.
    proxy_hide_header X-Frame-Options;

    # Metaobject import payloads can be large, and an import can run well past
    # nginx's 60s default.
    client_max_body_size 25m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    access_log /var/log/nginx/shopify-app.access.log;
    error_log  /var/log/nginx/shopify-app.error.log warn;

    location / {
        proxy_pass http://shopify_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # No Upgrade/Connection headers: the production server serves plain
        # HTTP only. Websockets are a dev-mode (Vite HMR) concern.

        # Stream responses straight through rather than buffering them to disk.
        proxy_buffering off;
    }
}
# END TLS
