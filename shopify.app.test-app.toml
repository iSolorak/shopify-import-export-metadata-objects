# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "0035a3a7a4b32139c1b552815c23f537"
name = "test-app"
application_url = "https://shopify-app.solorak.xyz"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
#
# Kept in step with shopify.app.toml on purpose. `write_files` was missing here,
# so the metaobject import's image columns — the one feature that uploads to
# Content → Files — failed on the dev app while working on the live one.
scopes = "write_products,write_metaobjects,write_metaobject_definitions,read_inventory,write_inventory,read_locations,write_files"

[auth]
redirect_urls = [
  "https://shopify-app.solorak.xyz/auth/callback",
  "https://shopify-app.solorak.xyz/auth/shopify/callback",
  "https://shopify-app.solorak.xyz/api/auth/callback",
]
