# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "0035a3a7a4b32139c1b552815c23f537"
name = "Metaobject-Import-Export"
application_url = "https://shopify-app.solorak.xyz"
embedded = true

[build]
# Public app: never let a local `shopify app dev` run rewrite the live
# application_url / redirect_urls. Use shopify.app.test-app.toml for dev.
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  # Mandatory for any app distributed through the Shopify App Store.
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/compliance"
  compliance_topics = [
    "customers/data_request",
    "customers/redact",
    "shop/redact",
  ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_metaobjects,write_metaobject_definitions"

[auth]
redirect_urls = [
  "https://shopify-app.solorak.xyz/auth/callback",
  "https://shopify-app.solorak.xyz/auth/shopify/callback",
  "https://shopify-app.solorak.xyz/api/auth/callback",
]

# No [app_proxy]: the storefront banner it served has been removed.
#
# No [product.metafields] or [metaobjects] blocks either. Those declared the
# Shopify template's demo metafield and its "$app:example" metaobject
# definition, which the deleted demo page created records with. This app reads
# and writes the store's own metaobject definitions through the Admin API
# instead, so it declares none of its own.
